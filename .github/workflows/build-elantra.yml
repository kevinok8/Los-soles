name: Build Elantra Smart Cockpit APK
on:
  push:
    paths:
      - '.github/workflows/build-elantra.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher branch
        uses: actions/checkout@v4
        with:
          ref: elantra-smart-cockpit-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p elantra-app assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ElantraSmartCockpit-v0.1-debug
          path: elantra-app/app/build/outputs/apk/debug/app-debug.apk
